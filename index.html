<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hatm</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f0;--card:#fff;--ink:#12302d;--mut:#5d7673;--pri:#0f4c45;--gold:#b8891a;--ok:#1f8a5b;--okbg:#dff2e8;--ln:#d3dfdb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1b19;--card:#142a27;--ink:#e6f1ee;--mut:#8fa9a5;--pri:#2c9a8b;--gold:#e0b24a;--ok:#5fd09a;--okbg:#17372d;--ln:#244542}}
:root[data-theme="dark"]{--bg:#0c1b19;--card:#142a27;--ink:#e6f1ee;--mut:#8fa9a5;--pri:#2c9a8b;--gold:#e0b24a;--ok:#5fd09a;--okbg:#17372d;--ln:#244542}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Nunito Sans',system-ui,sans-serif}
h1,h2,h3{font-family:Amiri,Georgia,serif;margin:0;line-height:1.2}
header{display:flex;justify-content:center;align-items:center;padding:14px 16px;background:var(--pri);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-family:Amiri,serif;font-size:22px;cursor:pointer}
header nav{display:flex;gap:6px}
main{max-width:760px;margin:0 auto;padding:16px}
.btn{border:0;border-radius:10px;padding:10px 16px;font:600 15px 'Nunito Sans',sans-serif;background:var(--pri);color:#fff;cursor:pointer;min-height:44px}
.btn.alt{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
header .btn{background:rgba(255,255,255,.16);min-height:38px;padding:6px 12px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}.btn.red{background:#b3402f}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{padding:26px 4px 8px}.hero h1{font-size:38px}.hero p{color:var(--mut);margin:8px 0 18px;max-width:46ch}
.row{display:flex;gap:10px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:12px 0}
.hl{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.mut{color:var(--mut);font-size:14px}
.done{background:var(--okbg);border:1.5px solid var(--ok);border-radius:14px;padding:18px;text-align:center;margin:12px 0}
.done h2{color:var(--ok);font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pora{background:var(--card);border:1.5px solid var(--ln);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.pora.read{background:var(--okbg);border-color:var(--ok)}
.pora.me{box-shadow:0 0 0 3px var(--gold)}
.pora .n{font:700 26px Amiri,serif}
.tag{font-size:13px;font-weight:600;color:var(--mut)}.read .tag{color:var(--ok)}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink);font:16px 'Nunito Sans',sans-serif}
textarea{min-height:110px}
.asg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.asg div{display:flex;align-items:center;gap:6px}.asg span{width:34px;font-weight:800}
.badge{font-size:12px;font-weight:800;padding:2px 9px;border-radius:20px;background:var(--okbg);color:var(--ok)}
.linkbox{display:flex;gap:8px;margin-top:8px}.linkbox input{font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:9;font-weight:600}
.demo{background:var(--gold);color:#1b1500;text-align:center;font-size:13px;font-weight:700;padding:4px}
.tabs{display:flex;justify-content:center;gap:4px;background:var(--card);border-bottom:1px solid var(--ln);padding:6px}
.tabs button{border:0;background:transparent;color:var(--mut);font:600 14px 'Nunito Sans',sans-serif;padding:8px 14px;border-radius:8px;min-height:38px;cursor:pointer}
.tabs button.on{background:var(--okbg);color:var(--ok)}
footer{text-align:center;padding:24px 0 32px}footer button{background:none;border:0;color:var(--mut);font:14px 'Nunito Sans',sans-serif;cursor:pointer;text-decoration:underline;min-height:40px}
</style></head><body>
<header><b onclick="go('')">Hatm</b></header><div id="nav"></div>
<main id="app"></main><footer id="ft"></footer>
<script>
const NAMES=['Bilol','Hasan','Husayn','Yusuf','Ibrohim','Zayd'];
function mk(title,fixed,readN){const o=Array(30).fill(null);for(const k in fixed)o[k-1]=fixed[k];let i=0;for(let n=0;n<30;n++)if(!o[n])o[n]=NAMES[i++%NAMES.length];
 const r=Array(30).fill(false);readN.forEach(n=>r[n-1]=true);return{id:Math.random().toString(36).slice(2,8),title,owner:o,read:r}}
let hatms=[mk('Oilaviy hatm — Demo',{17:'Ahmad',5:'Ali',23:'Muhammad',9:'Umar'},[1,2,5,9,12]),
 mk('Ramazon hatmi — Demo',{1:'Ahmad',2:'Ali',3:'Umar'},[...Array(30).keys()].map(n=>n+1).filter(n=>n!==17))];
let admin=false,me='',draft=null;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fd(s){if(!s)return'—';const[y,m,d]=s.split('-');return d+'.'+m+'.'+y}
const cnt=h=>h.read.filter(Boolean).length,fin=h=>cnt(h)===30;
const link=h=>location.href.split('#')[0]+'#/h/'+h.id;
function go(p){location.hash=p;render()}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function copy(t){const ok=()=>toast('Havola nusxalandi');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
 function fb(){const i=document.createElement('input');i.value=t;document.body.appendChild(i);i.select();try{document.execCommand('copy')}catch(e){}i.remove();ok()}}
function prog(h){const c=cnt(h);return`<div class="bar"><i style="width:${c/30*100}%"></i></div><div class="mut">${c} / 30 pora o'qildi (${Math.round(c/30*100)}%)</div>`}
function card(h){return`<div class="card"><div class="hl"><div><h3>${esc(h.title)}</h3><div class="mut">Boshlangan sana: ${fd(h.start)}</div>${fin(h)?'<span class="badge">Hatm yakunlandi</span>':''}</div><button class="btn sm" data-act="open" data-id="${h.id}">Ochish</button></div>${prog(h)}</div>`}
function home(){const a=hatms.filter(h=>!fin(h)),d=hatms.filter(fin);
 return`<div class="hero"><h1>Birgalikda Qur'on xatm qilamiz</h1><p>30 pora ishtirokchilar o'rtasida bo'linadi. Har kim o'z poralarini o'qib, “O'qidim” tugmasini bosadi.</p></div>
 <h2 style="margin-top:22px">Faol hatmlar</h2>${a.map(card).join('')||'<p class="mut">Hozircha faol hatm yo\'q. Yangisini yarating.</p>'}
 ${d.length?'<h2 style="margin-top:22px">Yakunlangan hatmlar</h2>'+d.map(card).join(''):''}`}
function login(){return`<div class="card"><h2>Admin kirishi</h2><p class="mut">Demo uchun: login <b>admin</b>, parol <b>1234</b></p><label>Login</label><input id="lu" value="admin" autocomplete="off"><label>Parol</label><input id="lp" type="password" value="1234"><div class="row" style="margin-top:16px"><button class="btn" data-act="dologin">Kirish</button></div></div>`}
function panel(){return`<h2>Admin paneli</h2>${hatms.map(h=>`<div class="card"><div class="hl"><h3>${esc(h.title)}</h3>${fin(h)?'<span class="badge">Yakunlandi</span>':''}</div>${prog(h)}<div class="mut">Boshlangan sana: ${fd(h.start)}</div><div class="mut">Ishtirokchilar: ${[...new Set(h.owner)].length}</div>
 <div class="linkbox"><input readonly value="${esc(link(h))}"><button class="btn sm" data-act="copy" data-id="${h.id}">Nusxalash</button></div>
 <div class="row" style="margin-top:10px"><button class="btn sm alt" data-act="open" data-id="${h.id}">Ochish</button><button class="btn sm alt" data-act="unr" data-id="${h.id}">O'qimaganlar</button><button class="btn sm alt" data-act="reset" data-id="${h.id}">Qayta boshlash</button><button class="btn sm red" data-act="del" data-id="${h.id}">O'chirish</button></div></div>`).join('')||'<p class="mut">Hatm yo\'q.</p>'}`}
function names(){return($('#nm')?$('#nm').value:draft.names).split('\n').map(s=>s.trim()).filter(Boolean)}
function asg(){const ns=[...new Set(names())];if(!ns.length)return'<p class="mut">Avval ismlarni kiriting.</p>';
 return'<div class="asg">'+draft.owner.map((o,i)=>`<div><span>${i+1}</span><select data-i="${i}">${ns.map(n=>`<option ${n===o?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`).join('')+'</div>'}
function auto(){const ns=[...new Set(names())];draft.owner=Array.from({length:30},(_,i)=>ns[i%ns.length]||'')}
function form(){if(!draft){draft={names:'Ahmad\nAli\nMuhammad\nUmar',owner:[]};auto()}
 return`<div class="card"><h2>Yangi hatm</h2><label>Hatm nomi</label><input id="tt" value="Oilaviy hatm — Demo"><label>Ishtirokchilar (har qatorda bitta ism)</label><textarea id="nm">${esc(draft.names)}</textarea>
 <div class="row" style="margin:12px 0"><button class="btn alt sm" data-act="auto">Poralarni teng taqsimlash</button></div><h3>Har bir ishtirokchiga pora biriktirish</h3><p class="mut">Har pora uchun ismni o'zgartirishingiz mumkin.</p><div id="asg">${asg()}</div>
 <div class="row" style="margin-top:18px"><button class="btn" data-act="create">Hatm yaratish</button><button class="btn alt" data-act="back">Bekor qilish</button></div></div>`}
function view(id){const h=hatms.find(x=>x.id===id);if(!h)return'<p>Hatm topilmadi.</p>';const ns=[...new Set(h.owner)];
 return`<h1>${esc(h.title)}</h1><div class="mut" style="margin-top:4px">Boshlangan sana: ${fd(h.start)}</div>${fin(h)?'<div class="done"><h2>Hatm yakunlandi</h2><p>Alloh qabul qilsin. Barcha 30 pora o\'qildi.</p></div>':''}${prog(h)}
 
 
 ${admin?`<div class="row" style="margin-top:12px"><button class="btn sm alt" data-act="unr" data-id="${h.id}">O'qimaganlar ro'yxati</button></div>`:''}<h2 style="margin:18px 0 10px">30 pora</h2><div class="grid">${h.owner.map((o,i)=>{const r=h.read[i],mine=me&&o===me;return`<div class="pora ${r?'read':''} ${mine?'me':''}"><div class="n">${i+1}-pora</div><div>${esc(o)}</div><div class="tag">${r?'O\'qildi':'O\'qilmagan'}</div>${r?`<button class="btn sm alt" data-act="tog" data-id="${h.id}" data-i="${i}">Bekor qilish</button>`:`<button class="btn sm" data-act="tog" data-id="${h.id}" data-i="${i}">O'qidim</button>`}</div>`}).join('')}</div>`}
function render(){const p=location.hash.replace('#/','').split('/');let h='';
 if(p[0]==='h'&&p[1])h=view(p[1]);else if(p[0]==='new')h=form();else if(p[0]==='login')h=login();else if(p[0]==='admin')h=admin?panel():login();else h=home();
 $('#app').innerHTML=h;$('#nav').innerHTML=admin?'<button class="btn" data-act="adm">Panel</button><button class="btn" data-act="logout">Chiqish</button>':'<button class="btn" data-act="adm">Admin</button>';scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,h=hatms.find(x=>x.id===b.dataset.id);
 if(a==='open')go('/h/'+h.id);else if(a==='new'){draft=null;go('/new')}else if(a==='adm')go(admin?'/admin':'/login');else if(a==='back')go('');
 else if(a==='dologin'){if($('#lu').value==='admin'&&$('#lp').value==='1234'){admin=true;go('/admin')}else toast('Login yoki parol noto\'g\'ri')}
 else if(a==='logout'){admin=false;go('')}else if(a==='copy')copy(link(h));
 else if(a==='reset'){h.read.fill(false);render()}else if(a==='del'){hatms=hatms.filter(x=>x!==h);render()}
 else if(a==='auto'){draft.names=$('#nm').value;auto();$('#asg').innerHTML=asg()}
 else if(a==='tog'){const i=+b.dataset.i;h.read[i]=!h.read[i];const y=scrollY;render();scrollTo(0,y);if(fin(h)&&h.read[i])toast('Hatm yakunlandi!')}
 else if(a==='create'){const t=$('#tt').value.trim(),ns=names();if(!t||!ns.length)return toast('Nom va ismlarni kiriting');
  const ok=new Set(ns);const o=draft.owner.map(x=>ok.has(x)?x:ns[0]);const n={id:Math.random().toString(36).slice(2,8),title:t,owner:o,read:Array(30).fill(false)};hatms.unshift(n);toast('Hatm yaratildi');go('/h/'+n.id)}});
document.addEventListener('change',e=>{if(e.target.id==='me'){me=e.target.value;const y=scrollY;render();scrollTo(0,y)}else if(e.target.dataset.i&&draft)draft.owner[+e.target.dataset.i]=e.target.value});
document.addEventListener('input',e=>{if(e.target.id==='nm'){draft.names=e.target.value;auto();$('#asg').innerHTML=asg()}});
addEventListener('hashchange',render);render();
</script>
<script>
const PEOPLE0=['Опададам','Каттабум','Исмолижон амаким','Сирожиддин амаким','Зияуддин амаким','Аммам','Дадам','Яхёддин амаким','Муфаззал опам','Фотима опам','Захро опам','Мурод акам','Масрура опам','Нусратуллох акам','Мухаммад акам','Асадуллох - Фатхуллох','София','Асмо - Уммугулсум опам','Рахматуллох - Марйам','Сайфуллох','Хафизуллох акам','Ваззох','Мутасим','Жафар - Хамза','Мехрибон','Аброр','Али','Махбуба','Хожар','Тойба - Саад'];
let PEOPLE=PEOPLE0.slice(),D=null;
(function(){const o=Array(30),r=Array(30).fill(true);PEOPLE0.forEach((n,i)=>o[(i+3)%30]=n);r[13]=false;r[16]=false;
 hatms=[{id:'h34demo',title:'34-хатим — Demo',owner:o,read:r,start:'2026-09-27'}]})();
const taken=()=>Object.values(D.pick).filter(Boolean).map(Number);
function form(){if(!D){D={title:'',start:new Date().toISOString().slice(0,10),pick:{}};PEOPLE.forEach(n=>D.pick[n]='')}
 const t=taken();
 return`<div class="card"><h2>Yangi hatm</h2><label>Hatm nomi</label><input id="tt" value="${esc(D.title)}" placeholder="35-хатим"><label>Boshlangan sana</label><input id="dt" type="date" value="${D.start}"><div class="hl" style="margin:18px 0 4px"><h3>Ishtirokchilar</h3><span class="badge">${t.length} / 30 pora</span></div><p class="mut">Har bir ism yoniga nechanchi pora o'qishini tanlang.</p>
 <div class="asg" style="grid-template-columns:1fr">${PEOPLE.map((n,i)=>`<div><span style="flex:1;width:auto">${esc(n)}</span><select style="width:112px" data-p="${i}"><option value="">—</option>${Array.from({length:30},(_,k)=>k+1).map(k=>`<option value="${k}" ${D.pick[n]==k?'selected':''} ${t.includes(k)&&D.pick[n]!=k?'disabled':''}>${k}-pora</option>`).join('')}</select></div>`).join('')}</div>
 <div class="row" style="margin-top:14px"><button class="btn alt sm" data-act="fill">Qolganini tartib bilan to'ldirish</button><button class="btn alt sm" data-act="rnd">Tasodifiy taqsimlash</button><button class="btn alt sm" data-act="clr">Tozalash</button></div>
 <div class="row" style="margin-top:18px"><button class="btn" data-act="make">Hatm yaratish</button><button class="btn alt" data-act="back">Bekor qilish</button></div></div>`}
function redraw(){const y=scrollY;$('#app').innerHTML=form();scrollTo(0,y)}
const _pn=panel;panel=()=>`<div class="card"><h3>Ishtirokchilar ro'yxati</h3><p class="mut">Har qatorda bitta ism. Yangi hatmda shu ro'yxat tayyor turadi.</p><textarea id="pp" style="min-height:160px">${esc(PEOPLE.join('\n'))}</textarea><div class="row" style="margin-top:10px"><button class="btn sm" data-act="savep">Ro'yxatni saqlash</button></div></div>`+_pn();
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='new'){if(!admin){e.stopPropagation();toast('Avval admin sifatida kiring');go('/login');return}D=null}
 else if(a==='clr'){PEOPLE.forEach(n=>D.pick[n]='');redraw()}
 else if(a==='fill'){const t=taken(),free=[];for(let k=1;k<=30;k++)if(!t.includes(k))free.push(k);PEOPLE.forEach(n=>{if(!D.pick[n]&&free.length)D.pick[n]=free.shift()});redraw()}
 else if(a==='make'){const t=taken();if(!D.title.trim())return toast('Hatm nomini kiriting');if(t.length<30)return toast((30-t.length)+' ta pora biriktirilmagan');
  const o=Array(30);PEOPLE.forEach(n=>{if(D.pick[n])o[D.pick[n]-1]=n});const h={id:Math.random().toString(36).slice(2,8),title:D.title.trim(),start:D.start,owner:o,read:Array(30).fill(false)};hatms.unshift(h);D=null;toast('Hatm yaratildi');go('/h/'+h.id)}
 else if(a==='savep'){PEOPLE=[...new Set($('#pp').value.split('\n').map(s=>s.trim()).filter(Boolean))];toast("Ro'yxat saqlandi")}},true);
document.addEventListener('change',e=>{if(e.target.dataset.p!==undefined&&D){D.pick[PEOPLE[+e.target.dataset.p]]=e.target.value;redraw()}});
document.addEventListener('input',e=>{if(!D)return;if(e.target.id==='tt')D.title=e.target.value;else if(e.target.id==='dt')D.start=e.target.value});
function login(){return`<div class="card"><h2>Admin kirishi</h2><p class="mut">Demo uchun: ism <b>admin</b>, parol <b>1234</b></p><label>Ism</label><input id="lu" value="admin" autocomplete="off"><label>Parol</label><input id="lp" type="password" value="1234"><div class="row" style="margin-top:16px"><button class="btn" data-act="dologin">Kirish</button></div></div>`}
function render(){const p=location.hash.replace('#/','').split('/'),k=p[0];let h;
 if(k==='h'&&p[1])h=view(p[1]);else if(k==='unread'&&p[1])h=admin?unread(p[1]):login();else if(k==='new')h=admin?form():login();else if(k==='admin'||k==='login')h=admin?panel():login();else h=home();
 $('#app').innerHTML=h;
 $('#nav').innerHTML=admin?`<div class="tabs"><button class="${k==='admin'?'on':''}" data-act="adm">Panel</button><button class="${k==='new'?'on':''}" data-act="new">Yangi hatm</button><button data-act="logout">Chiqish</button></div>`:'';
 $('#ft').innerHTML=admin?'':'<button data-act="adm">Admin kirishi</button>';scrollTo(0,0)}
render();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://ocpsuwfwmdtqngxicjtc.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jcHN1d2Z3bWR0cW5neGljanRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNTM1NTIsImV4cCI6MjEwNjYyOTU1Mn0.mADec10CvPTq0c1Q4E1nciaU4pyXswPj7wS0EUjVJjs');
let snap={h:[],p:[]},busy=false,again=false;
const cp=o=>JSON.parse(JSON.stringify(o)),isU=id=>/^[0-9a-f-]{36}$/.test(id),mark=()=>{snap={h:cp(hatms),p:cp(PEOPLE)}};
const chk=async q=>{const{error}=await q;if(error)throw error};
async function load(){const[a,b,c]=await Promise.all([sb.from('people').select('name').order('sort'),sb.from('hatms').select('*').order('created_at',{ascending:false}),sb.from('assignments').select('*')]);
 if(a.error||b.error||c.error)throw(a.error||b.error||c.error);PEOPLE=a.data.map(x=>x.name);
 hatms=b.data.map(h=>{const o=Array(30).fill(''),r=Array(30).fill(false);c.data.filter(x=>x.hatm_id===h.id).forEach(x=>{o[x.pora-1]=x.person;r[x.pora-1]=x.is_read});return{id:h.id,title:h.title,start:h.start_date,owner:o,read:r}})}
async function reload(){const y=scrollY;await load();mark();render();scrollTo(0,y)}
async function sync(){if(busy){again=true;return}busy=true;try{
 if(JSON.stringify(PEOPLE)!==JSON.stringify(snap.p)){await chk(sb.from('people').delete().neq('name','__'));if(PEOPLE.length)await chk(sb.from('people').insert(PEOPLE.map((name,i)=>({name,sort:i}))))}
 for(const h of hatms.slice()){
  if(!isU(h.id)){const{data,error}=await sb.from('hatms').insert({title:h.title,start_date:h.start}).select().single();if(error)throw error;
   await chk(sb.from('assignments').insert(h.owner.map((person,i)=>({hatm_id:data.id,pora:i+1,person}))));h.id=data.id;if(location.hash.includes('/h/'))go('/h/'+data.id);continue}
  const o=snap.h.find(x=>x.id===h.id);if(!o)continue;
  for(let i=0;i<30;i++)if(h.read[i]!==o.read[i]){if(h.read[i])await chk(sb.rpc('mark_read',{p_hatm:h.id,p_pora:i+1}));else await chk(sb.rpc('unmark_read',{p_hatm:h.id,p_pora:i+1}))}}
 for(const o of snap.h)if(!hatms.find(x=>x.id===o.id))await chk(sb.from('hatms').delete().eq('id',o.id));
 mark()}catch(e){toast('Xatolik: '+(e.message||e));try{await reload()}catch(_){}}
 busy=false;if(again){again=false;sync()}}
['click','change'].forEach(t=>document.addEventListener(t,()=>setTimeout(sync,50)));
document.addEventListener('click',async e=>{if(!e.target.closest('[data-act="dologin"]'))return;e.stopPropagation();
 const{error}=await sb.auth.signInWithPassword({email:(v=>v.includes('@')?v:v+'@hatm.app')($('#lu').value.trim().toLowerCase()),password:$('#lp').value});
 if(error)return toast("Ism yoki parol noto'g'ri");admin=true;go('/admin')},true);
document.addEventListener('click',e=>{if(e.target.closest('[data-act="logout"]'))sb.auth.signOut()});
function login(){return`<div class="card"><h2>Admin kirishi</h2><label>Ism</label><input id="lu" autocomplete="username" autocapitalize="none"><label>Parol</label><input id="lp" type="password" autocomplete="current-password"><div class="row" style="margin-top:16px"><button class="btn" data-act="dologin">Kirish</button></div></div>`}
hatms=[];PEOPLE=[];$('#app').innerHTML='<p class="mut">Yuklanmoqda…</p>';
(async()=>{try{const{data}=await sb.auth.getSession();admin=!!data.session;await load();mark();render()}catch(e){$('#app').innerHTML='<div class="card"><b>Ma\'lumotlar yuklanmadi.</b><p class="mut">'+esc(e.message||e)+'</p></div>'}})();
setInterval(()=>{const a=document.activeElement;if(busy||document.hidden||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))||location.hash.startsWith('#/new'))return;reload().catch(()=>{})},20000);
function ur(h){const m={};h.owner.forEach((n,i)=>{if(!h.read[i])(m[n]=m[n]||[]).push(i+1)});return Object.entries(m).sort((a,b)=>a[1][0]-b[1][0])}
function days(h){return h.start?Math.max(0,Math.floor((Date.now()-new Date(h.start+'T00:00:00'))/864e5)):0}
const cntU=l=>l.reduce((s,x)=>s+x[1].length,0);
function utext(h){const l=ur(h);if(!l.length)return h.title+`\nBarcha poralar o'qildi, Alhamdulillah!`;
 return `📖 ${h.title}\nBoshlangan: ${fd(h.start)} (${days(h)} kun oldin)\n\nO'qimaganlar: ${l.length} kishi, ${cntU(l)} ta pora\n\n`+l.map(([a,b])=>`• ${a} — ${b.join(', ')}-pora`).join('\n')+`\n\nIltimos, o'qib "O'qidim" tugmasini bosing:\n${link(h)}`}
function unread(id){const h=hatms.find(x=>x.id===id);if(!h)return'<p>Hatm topilmadi.</p>';const l=ur(h);
 return `<h2>${esc(h.title)}</h2><div class="mut">Boshlangan sana: ${fd(h.start)} (${days(h)} kun oldin)</div>
 <div class="card"><div class="hl"><h3>O'qimaganlar</h3><span class="badge">${l.length} kishi, ${cntU(l)} pora</span></div>${l.length?l.map(([a,b])=>`<div class="hl" style="padding:8px 0;border-top:1px solid var(--ln)"><span>${esc(a)}</span><b>${b.join(', ')}-pora</b></div>`).join(''):'<p class="mut">Hamma o\'qib bo\'lgan.</p>'}</div>
 <div class="row"><button class="btn" data-act="utxt" data-id="${h.id}">Matnni nusxalash</button><button class="btn alt" data-act="uimg" data-id="${h.id}">Rasm sifatida</button><button class="btn alt" data-act="open" data-id="${h.id}">Orqaga</button></div>`}
function copyT(t){const ok=()=>toast('Matn nusxalandi');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
 function fb(){const i=document.createElement('textarea');i.value=t;document.body.appendChild(i);i.select();try{document.execCommand('copy')}catch(e){}i.remove();ok()}}
function uimg(h){const l=ur(h),W=1080,P=56,LH=64,hd=250,c=document.createElement('canvas');c.width=W;c.height=hd+Math.max(1,l.length)*LH+110;const x=c.getContext('2d');
 x.fillStyle='#eef3f0';x.fillRect(0,0,W,c.height);x.fillStyle='#0f4c45';x.fillRect(0,0,W,hd);
 x.fillStyle='#fff';x.font='700 54px Georgia,serif';x.fillText(h.title,P,100);x.font='34px sans-serif';
 x.fillText('Boshlangan: '+fd(h.start)+' ('+days(h)+' kun oldin)',P,160);x.fillText("O'qimaganlar: "+l.length+' kishi, '+cntU(l)+' pora',P,210);
 l.forEach(([a,b],i)=>{const y=hd+i*LH;x.fillStyle=i%2?'#e3ece8':'#f7faf8';x.fillRect(0,y,W,LH);x.fillStyle='#12302d';x.font='600 34px sans-serif';x.fillText(a,P,y+43);
  x.font='700 34px sans-serif';x.fillStyle='#b3402f';x.textAlign='right';x.fillText(b.join(', ')+'-pora',W-P,y+43);x.textAlign='left'});
 x.fillStyle='#5d7673';x.font='28px sans-serif';x.fillText("Iltimos, o'qib \"O'qidim\" tugmasini bosing",P,c.height-40);
 c.toBlob(async bl=>{const f=new File([bl],'oqimaganlar.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(_){}}
  const u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download='oqimaganlar.png';a.click();toast('Rasm yuklab olindi')})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act="utxt"],[data-act="uimg"],[data-act="unr"],[data-act="rnd"]');if(!b)return;const a=b.dataset.act,h=hatms.find(x=>x.id===b.dataset.id);
 if(a==='unr')go('/unread/'+b.dataset.id);else if(a==='utxt'&&h)copyT(utext(h));else if(a==='uimg'&&h)uimg(h);
 else if(a==='rnd'&&D){const t=taken(),free=[];for(let k=1;k<=30;k++)if(!t.includes(k))free.push(k);
  for(let i=free.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[free[i],free[j]]=[free[j],free[i]]}
  PEOPLE.forEach(n=>{if(!D.pick[n]&&free.length)D.pick[n]=free.shift()});redraw()}});
</script></body></html>
